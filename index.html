<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Barangay E-Health</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
    }

    h1 {
      font-size: 3em;
      animation: fadeInZoom 3s ease-in-out infinite alternate;
    }

    @keyframes fadeInZoom {
      from {
        opacity: 0.5;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    button {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 8px;
      background: #ffcc00;
      color: #333;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff9900;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <h1>Barangay E-Health</h1>
  <button onclick="showMessage()">Enter Site</button>

  <script>
    function showMessage() {
      alert("Welcome to Barangay E-Health! Here you can access health services online.");
    }
  </script>
</body>
</html>
